version: 2
updates:
  # --- ROOT PROJECT ---
  # Weekly minor/patch updates
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Monthly updates (includes major versions)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"

  # --- WEBSITE PROJECT ---
  # Weekly minor/patch updates
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Monthly updates (includes major versions)
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
