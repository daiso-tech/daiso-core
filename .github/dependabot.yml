version: 2
updates:
  # --- ROOT PROJECT ---
  # Weekly minor/patch updates
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      root-weekly-updates:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: 
          - "version-update:semver-major"

  # Monthly updates (includes major versions)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      root-monthly-updates:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"

  # --- WEBSITE PROJECT ---
  # Weekly minor/patch updates
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
    groups:
      website-weekly-updates:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # Monthly updates (includes major versions)
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "monthly"
    groups:
      website-monthly-updates:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
